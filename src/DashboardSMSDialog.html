<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .dialog-header {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .btn-container {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="dialog-header">Send Expiration Notification SMS</div>
  
  <div class="mb-3">
    <strong>Employee:</strong> <?= employeeName ?><br>
    <strong>Phone:</strong> <?= phone ?><br>
    <strong>Certification:</strong> <?= certType ?>
  </div>

  <div class="mb-2"><strong>Message Preview:</strong></div>
  <textarea id="smsText" class="form-control mb-3" rows="3"><?= message ?></textarea>

  <div class="btn-container">
    <button type="button" class="btn btn-secondary btn-sm" onclick="google.script.host.close()">Cancel</button>
    <button type="button" class="btn btn-success btn-sm" onclick="sendSms()">💬 Open SMS App</button>
  </div>

  <script>
    var phone = '<?= cleanPhone ?>';
    var employeeName = '<?= employeeName ?>';
    var certType = '<?= certType ?>';

    function sendSms() {
      var msg = document.getElementById('smsText').value;
      var smsUrl = 'sms:' + phone + '?body=' + encodeURIComponent(msg);
      
      // Open native app
      window.open(smsUrl, '_blank');
      
      // Call backend to mark as notified
      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success === false) {
            alert('Failed to mark notified: ' + result.error);
          } else {
            google.script.host.close();
          }
        })
        .withFailureHandler(function(err) {
          alert('Server Error: ' + err.message);
        })
        .markCertNotifiedAndReload(employeeName, certType);
    }
  </script>
</body>
</html>
