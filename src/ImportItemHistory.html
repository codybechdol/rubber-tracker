<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      padding: 20px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-icon {
      font-size: 24px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 700;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    select, input, textarea {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
      min-height: 260px;
      height: 280px;
      white-space: pre;
    }

    .helper-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    button {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-secondary {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--bg-tertiary);
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }

    .alert-success {
      background-color: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }

    .alert-danger {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .alert-info {
      background-color: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">📥</div>
    <div>
      <div class="header-title">Import Item History Log</div>
      <div class="header-subtitle">Parse multi-line assignment notes into chronological history records</div>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label for="eq-type">Equipment Category</label>
      <select id="eq-type">
        <option value="Gloves" selected>🧤 Gloves</option>
        <option value="Sleeves">🧥 Sleeves</option>
        <option value="Blankets">🟨 Blankets</option>
        <option value="MACKs">⚡ MACKs</option>
        <option value="HV Testers">🔬 HV Testers</option>
        <option value="Phasing Sets">⚡ Phasing Sets</option>
        <option value="AED">🏥 AED</option>
        <option value="Grounds">⚡ Grounds</option>
        <option value="Hot Sticks">🔴 Hot Sticks</option>
      </select>
    </div>

    <div class="form-group">
      <label for="item-num">Item # or Serial # <span style="font-size: 11px; font-weight: normal; color: var(--text-muted);">(Optional if defined in text)</span></label>
      <input type="text" id="item-num" placeholder="e.g. 1024 (or paste batch text below)">
    </div>

    <div class="form-group full-width">
      <label for="log-text">History Log Text (One entry per line: Date - Holder/Status)</label>
      <textarea id="log-text" placeholder="Single item:
06/27/2024 - D Swann
10/15/2024 - In Testing
10/22/2024 - On Shelf

Or Multi-Item Batch (paste all items at once!):
Item 1024:
06/27/2024 - D Swann
10/15/2024 - In Testing

Item 1025:
05/10/2024 - J Doe
08/11/2024 - In Testing"></textarea>
      <div class="helper-text" style="display: flex; justify-content: space-between; align-items: center;">
        <span>💡 <strong>Batch Mode:</strong> You can paste multiple items at once by prefixing with <code>Item 1024:</code>, <code>#1025:</code>, etc.</span>
      </div>
    </div>
  </div>

  <div id="status-alert" class="alert"></div>

  <div class="button-group">
    <button type="button" class="btn-secondary" onclick="google.script.host.close()">Close</button>
    <button type="button" id="next-btn" class="btn-secondary" style="border-color: rgba(59, 130, 246, 0.4); color: #60a5fa;" onclick="submitImport(true)">⚡ Import & Next Item</button>
    <button type="button" id="submit-btn" class="btn-primary" onclick="submitImport(false)">📥 Import & Close</button>
  </div>

  <script>
    function showAlert(msg, type) {
      const el = document.getElementById('status-alert');
      el.className = 'alert alert-' + type;
      el.innerHTML = msg;
      el.style.display = 'block';
    }

    function submitImport(isNextMode) {
      const eqType = document.getElementById('eq-type').value;
      const itemNumEl = document.getElementById('item-num');
      const itemNum = itemNumEl.value.trim();
      const logTextEl = document.getElementById('log-text');
      const logText = logTextEl.value.trim();
      const submitBtn = document.getElementById('submit-btn');
      const nextBtn = document.getElementById('next-btn');

      if (!logText) {
        showAlert('Please paste history log text to import.', 'danger');
        return;
      }

      submitBtn.disabled = true;
      nextBtn.disabled = true;
      showAlert('⚡ Parsing and writing records...', 'info');

      google.script.run
        .withSuccessHandler(function(res) {
          submitBtn.disabled = false;
          nextBtn.disabled = false;
          if (res && res.success) {
            const timeStr = res.elapsedSeconds ? ' in ' + res.elapsedSeconds + 's' : '';
            let msg = '';
            if (res.count === 0 && res.skippedDuplicates > 0) {
              msg = 'ℹ️ All <strong>' + res.skippedDuplicates + '</strong> records already exist in history sheet (no duplicates added).';
            } else {
              const itemsStr = res.itemsCount && res.itemsCount > 1 ? res.itemsCount + ' items (' + res.count + ' records)' : res.count + ' records for ' + (itemNum ? eqType + ' #' + itemNum : eqType);
              const dupeNote = res.skippedDuplicates ? ' (' + res.skippedDuplicates + ' existing skipped)' : '';
              msg = '✅ Successfully imported <strong>' + itemsStr + '</strong>' + dupeNote + timeStr + '!';
            }
            showAlert(msg, res.count > 0 ? 'success' : 'info');
            
            if (isNextMode) {
              logTextEl.value = '';
              // If itemNum is numeric, try incrementing it as a helpful suggestion
              const numVal = parseInt(itemNum, 10);
              if (!isNaN(numVal) && String(numVal) === itemNum) {
                itemNumEl.value = numVal + 1;
              } else {
                itemNumEl.value = '';
              }
              itemNumEl.focus();
            } else {
              setTimeout(function() {
                google.script.host.close();
              }, 2200);
            }
          } else {
            showAlert('❌ ' + (res && res.error ? res.error : 'Import failed.'), 'danger');
          }
        })
        .withFailureHandler(function(err) {
          submitBtn.disabled = false;
          nextBtn.disabled = false;
          showAlert('❌ Error: ' + err.message, 'danger');
        })
        .parseAndImportItemHistoryLog(eqType, itemNum, logText);
    }
  </script>
</body>
</html>
