    // Handler for dropping into office tasks list (convert to phone tasks)
    function handleDropToOfficeTasks(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over-office');
      e.currentTarget.style.backgroundColor = '';
      e.currentTarget.style.borderColor = '';

      console.log('handleDropToOfficeTasks triggered');
      console.log('draggedLocationData:', draggedLocationData);

      if (!draggedLocationData) {
        console.log('No dragged location data - aborting drop');
        return;
      }

      // Initialize officeTasks array if not present
      if (!tripPlan.officeTasks) {
        tripPlan.officeTasks = [];
      }

      // Handle drop from assigned day
      if (draggedLocationData.type === 'assigned') {
        var loc = draggedLocationData.location;
        var locationName = loc.location || loc.name || 'Unknown';
        var sourceDayIdx = draggedLocationData.dayIndex;

        // Check if locked - can't move locked tasks
        if (loc.isLocked) {
          showStatus('🔒 Cannot move locked tasks to Office/Phone. Edit Manual Tasks sheet to unlock.', 'error');
          return;
        }

        // Remove from source day
        if (sourceDayIdx >= 0 && sourceDayIdx < tripPlan.workDays.length) {
          tripPlan.workDays[sourceDayIdx].assignedLocations.splice(draggedLocationData.locIndex, 1);
        }

        // Convert tasks to office tasks
        var tasks = loc.tasks || [];
        tasks.forEach(function(task) {
          // Mark as office/phone task
          task.isOfficeTask = true;
          task.scheduledDate = null; // Unschedule
          tripPlan.officeTasks.push(task);
        });

        showStatus('Moved ' + tasks.length + ' task(s) from ' + locationName + ' to Office/Phone Tasks', 'success');

        // Re-render
        renderOfficeTasks();
        recalculateDays([sourceDayIdx]);
        return;
      }

      // Handle drop from unassigned
      if (draggedLocationData.type === 'unassigned') {
        var loc = draggedLocationData.location;
        var locationName = loc.location || loc.name || 'Unknown';

        // Find and remove from unassigned locations
        var idx = tripPlan.unassignedLocations.findIndex(function(u) {
          return (u.location || u.name) === locationName;
        });

        if (idx >= 0) {
          tripPlan.unassignedLocations.splice(idx, 1);
        }

        // Convert tasks to office tasks
        var tasks = loc.tasks || [];
        tasks.forEach(function(task) {
          task.isOfficeTask = true;
          task.scheduledDate = null;
          tripPlan.officeTasks.push(task);
        });

        showStatus('Moved ' + tasks.length + ' task(s) from ' + locationName + ' to Office/Phone Tasks', 'success');

        // Re-render
        renderUnassigned();
        return;
      }

      // Handle drop of individual unassigned task
      if (draggedLocationData.type === 'unassignedTask') {
        var task = draggedLocationData.task;
        var parentLocation = draggedLocationData.parentLocation;

        if (!task) {
          console.log('No task data in unassignedTask drop');
          return;
        }

        // Remove task from parent location
        if (parentLocation && parentLocation.tasks) {
          var taskIdx = draggedLocationData.taskIndex;
          if (taskIdx >= 0 && taskIdx < parentLocation.tasks.length) {
            parentLocation.tasks.splice(taskIdx, 1);
            parentLocation.taskCount = parentLocation.tasks.length;

            // If location is now empty, remove it from unassigned
            if (parentLocation.tasks.length === 0) {
              var locIdx = tripPlan.unassignedLocations.findIndex(function(u) {
                return (u.location || u.name) === (parentLocation.location || parentLocation.name);
              });
              if (locIdx >= 0) {
                tripPlan.unassignedLocations.splice(locIdx, 1);
              }
            }
          }
        }

        // Add to office tasks
        task.isOfficeTask = true;
        task.scheduledDate = null;
        tripPlan.officeTasks.push(task);

        var employeeName = task.employee || 'Unknown';
        showStatus('Moved ' + employeeName + ' task to Office/Phone Tasks', 'success');

        // Re-render
        renderUnassigned();
        return;
      }

      console.log('Unhandled drag type:', draggedLocationData.type);
    }

    // Handler for dropping into unassigned list (unscheduling a task)
    function handleDropToUnassigned(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over-unassigned');

      console.log('handleDropToUnassigned triggered');
      console.log('draggedLocationData:', draggedLocationData);

      if (!draggedLocationData || !draggedLocationData.location) {
        console.log('No dragged location data - aborting drop');
        return;
      }

      // Only handle drops from assigned days (not from unassigned list to itself)
      if (draggedLocationData.type !== 'assigned') {
        console.log('Not dropping from assigned location - ignoring');
        return;
      }

      var loc = draggedLocationData.location;
      var locationName = loc.location || loc.name || 'Unknown';
      var sourceDayIdx = draggedLocationData.dayIndex;

      // Check if locked - can't unschedule locked tasks
      if (loc.isLocked) {
        showStatus('🔒 Cannot unschedule locked tasks. Edit Manual Tasks sheet to unlock.', 'error');
        return;
      }

      // Remove from source day
      if (sourceDayIdx >= 0 && sourceDayIdx < tripPlan.workDays.length) {
        tripPlan.workDays[sourceDayIdx].assignedLocations.splice(draggedLocationData.locIndex, 1);
      }

      // SPECIAL HANDLING: Helena Office locations - return tasks to office tasks list
      if (locationName === 'Helena Office' || loc.isOfficeLocation) {
        var officeTasks = loc.tasks || [];
        if (!tripPlan.officeTasks) {
          tripPlan.officeTasks = [];
        }

        // Add each task back to office tasks list
        for (var i = 0; i < officeTasks.length; i++) {
          tripPlan.officeTasks.push(officeTasks[i]);
        }

        showStatus('Returned ' + officeTasks.length + ' task(s) to Office/Phone Tasks', 'info');

        // Re-render office tasks and recalculate day
        renderOfficeTasks();
        recalculateDays([sourceDayIdx]);
        return;
      }

      // Add tasks back to unassigned locations
      if (!tripPlan.unassignedLocations) {
        tripPlan.unassignedLocations = [];
      }

      // Check if this location already exists in unassigned
      var existingLoc = tripPlan.unassignedLocations.find(function(u) {
        return (u.location || u.name) === locationName;
      });

      if (existingLoc) {
        // Merge tasks into existing unassigned location
        existingLoc.tasks = existingLoc.tasks || [];
        var tasksToAdd = loc.tasks || [];
        for (var i = 0; i < tasksToAdd.length; i++) {
          existingLoc.tasks.push(tasksToAdd[i]);
        }
        existingLoc.taskCount = existingLoc.tasks.length;
        existingLoc.maxUrgency = Math.max(existingLoc.maxUrgency || 0, loc.maxUrgency || 10);
      } else {
        // Create new unassigned location
        tripPlan.unassignedLocations.push({
          location: locationName,
          name: locationName,
          direction: loc.direction || 'Unknown',
          taskCount: loc.taskCount || (loc.tasks ? loc.tasks.length : 0),
          maxUrgency: loc.maxUrgency || 10,
          estimatedTime: loc.estimatedTime || 25,
          tasks: loc.tasks || []
        });
      }

      showStatus('Unscheduled ' + locationName + ' - moved to Unassigned Tasks', 'info');

      // Re-render unassigned and recalculate the affected day
      renderUnassigned();
      recalculateDays([sourceDayIdx]);
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      var dropZone = e.currentTarget;
      dropZone.closest('.day-card').classList.add('drag-over');

      // Clear previous indicators
      dropZone.querySelectorAll('.location-card').forEach(function(card) {
        card.classList.remove('drag-over-above', 'drag-over-below');
      });

      // Show indicator on target card
      var locationCards = dropZone.querySelectorAll('.location-card');
      if (locationCards.length > 0) {
        var mouseY = e.clientY;

        for (var i = 0; i < locationCards.length; i++) {
          var card = locationCards[i];
          var rect = card.getBoundingClientRect();
          var cardMiddle = rect.top + rect.height / 2;

          if (mouseY < cardMiddle) {
            card.classList.add('drag-over-above');
            return;
          }
        }

        // Show indicator below last card
        locationCards[locationCards.length - 1].classList.add('drag-over-below');
      }
    }

    function handleDragLeave(e) {
      var dropZone = e.currentTarget;
      dropZone.closest('.day-card').classList.remove('drag-over');

      // Clear indicators
      dropZone.querySelectorAll('.location-card').forEach(function(card) {
        card.classList.remove('drag-over-above', 'drag-over-below');
      });
    }

    function handleDrop(e) {
      e.preventDefault();
      console.log('handleDrop triggered');

      var dropZone = e.currentTarget;
      dropZone.closest('.day-card').classList.remove('drag-over');

      // Clear indicators
      dropZone.querySelectorAll('.location-card').forEach(function(card) {
        card.classList.remove('drag-over-above', 'drag-over-below');
      });

      console.log('draggedLocationData:', draggedLocationData);
      if (!draggedLocationData || !draggedLocationData.location) {
        console.log('No dragged location data - aborting drop');
        return;
      }

      var targetDayIndex = parseInt(dropZone.dataset.dayIndex);
      if (isNaN(targetDayIndex) || targetDayIndex < 0 || targetDayIndex >= tripPlan.workDays.length) {
        console.log('Invalid target day index:', targetDayIndex);
        return;
      }

      var targetDay = tripPlan.workDays[targetDayIndex];
      var sourceDayIdx = draggedLocationData.dayIndex;
      var isSameDay = (draggedLocationData.type === 'assigned' && sourceDayIdx === targetDayIndex);

      // Check if task can be moved
      var loc = draggedLocationData.location;
      var isLocked = loc.isLocked || false;
      var allowTimeChange = loc.allowTimeChange || false;

      // If locked AND moving to different day, block it
      if (isLocked && !isSameDay) {
        showStatus('🔒 Cannot move locked tasks to a different day. Edit Manual Tasks sheet to unlock.', 'error');
        return;
      }

      // If locked AND same day but no time flexibility, block reordering
      if (isLocked && isSameDay && !allowTimeChange) {
        showStatus('🔒 This task has a fixed time and cannot be reordered. Enable "Allow Time Change" in Manual Tasks to adjust.', 'error');
        return;
      }

      // Determine drop position within the day (for reordering)
      var dropIndex = getDropIndex(e, dropZone, targetDayIndex);

      // Get the location name to use (prefer 'location' for consistency)
      var locationName = draggedLocationData.location.location || draggedLocationData.location.name || 'Unknown';
      var sourceDayIdx = draggedLocationData.dayIndex;

      // Handle OFFICE TASK drop - special handling for Helena Office
      if (draggedLocationData.type === 'officeTask') {
        console.log('Handling office task drop');
        var officeTask = draggedLocationData.task;
        var taskIndex = draggedLocationData.index;

        // Remove from office tasks array
        if (taskIndex >= 0 && taskIndex < tripPlan.officeTasks.length) {
          tripPlan.officeTasks.splice(taskIndex, 1);
          console.log('Removed office task at index:', taskIndex);
        }

        // Check if Helena Office already exists on this day
        var helenaOfficeIndex = -1;
        for (var i = 0; i < targetDay.assignedLocations.length; i++) {
          var existingLoc = targetDay.assignedLocations[i];
          if (existingLoc.location === 'Helena Office' || existingLoc.isOfficeLocation) {
            helenaOfficeIndex = i;
            break;
          }
        }

        if (helenaOfficeIndex >= 0) {
          // Merge into existing Helena Office
          var existingHelenaOffice = targetDay.assignedLocations[helenaOfficeIndex];
          existingHelenaOffice.tasks = existingHelenaOffice.tasks || [];
          existingHelenaOffice.tasks.push(officeTask);
          existingHelenaOffice.taskCount = existingHelenaOffice.tasks.length;
          existingHelenaOffice.estimatedTime = existingHelenaOffice.tasks.length * 15; // 15 min per task
          existingHelenaOffice.maxUrgency = Math.max(existingHelenaOffice.maxUrgency || 0, officeTask.urgency || 10);

          showStatus('Added ' + (officeTask.employee || 'task') + ' to Helena Office on ' + targetDay.dayName, 'success');
        } else {
          // Create new Helena Office location
          var helenaOfficeLocation = {
            location: 'Helena Office',
            name: 'Helena Office',
            direction: 'Office',
            taskCount: 1,
            estimatedTime: 15, // 15 min default
            maxUrgency: officeTask.urgency || 10,
            tasks: [officeTask],
            isOfficeLocation: true,
            isManualTask: false,
            isLocked: false
          };

          // Insert at drop position (or end if not specified)
          if (dropIndex >= 0 && dropIndex <= targetDay.assignedLocations.length) {
            targetDay.assignedLocations.splice(dropIndex, 0, helenaOfficeLocation);
          } else {
            targetDay.assignedLocations.push(helenaOfficeLocation);
          }

          showStatus('Scheduled ' + (officeTask.employee || 'office task') + ' at Helena Office on ' + targetDay.dayName, 'success');
        }

        // Re-render and recalculate
        renderOfficeTasks();
        recalculateDays([targetDayIndex]);
        return;
      }

      // Handle INDIVIDUAL UNASSIGNED TASK drop
      if (draggedLocationData.type === 'unassignedTask') {
        console.log('Handling individual unassigned task drop');
        var task = draggedLocationData.task;
        var parentLoc = draggedLocationData.parentLocation;
        var taskLocationName = draggedLocationData.locationName;

        // Remove task from parent location's tasks array
        if (parentLoc && parentLoc.tasks) {
          var taskIdx = parentLoc.tasks.indexOf(task);
          if (taskIdx >= 0) {
            parentLoc.tasks.splice(taskIdx, 1);
            parentLoc.taskCount = parentLoc.tasks.length;
          }

          // If no tasks left, remove the location from unassigned
          if (parentLoc.tasks.length === 0) {
            var locIdx = tripPlan.unassignedLocations.indexOf(parentLoc);
            if (locIdx >= 0) {
              tripPlan.unassignedLocations.splice(locIdx, 1);
            }
          }
        }

        // Check if this location already exists on the target day
        var existingLocIndex = -1;
        for (var i = 0; i < targetDay.assignedLocations.length; i++) {
          var existingLoc = targetDay.assignedLocations[i];
          if (existingLoc.location === taskLocationName) {
            existingLocIndex = i;
            break;
          }
        }

        if (existingLocIndex >= 0) {
          // Merge into existing location on this day
          var existingLocation = targetDay.assignedLocations[existingLocIndex];
          existingLocation.tasks = existingLocation.tasks || [];
          existingLocation.tasks.push(task);
          existingLocation.taskCount = existingLocation.tasks.length;
          existingLocation.estimatedTime = 15 + (existingLocation.tasks.length * 10);
          existingLocation.maxUrgency = Math.max(existingLocation.maxUrgency || 0, task.urgency || 10);

          showStatus('Added ' + (task.employee || 'task') + ' to ' + taskLocationName + ' on ' + targetDay.dayName, 'success');
        } else {
          // Create new location entry for this day
          var newLocation = {
            location: taskLocationName,
            name: taskLocationName,
            direction: parentLoc ? parentLoc.direction : 'Unknown',
            taskCount: 1,
            estimatedTime: 25, // Default for single task at new location
            maxUrgency: task.urgency || 10,
            tasks: [task],
            isManualTask: false,
            isLocked: false
          };

          // Insert at drop position (or end if not specified)
          if (dropIndex >= 0 && dropIndex <= targetDay.assignedLocations.length) {
            targetDay.assignedLocations.splice(dropIndex, 0, newLocation);
          } else {
            targetDay.assignedLocations.push(newLocation);
          }

          showStatus('Scheduled ' + (task.employee || 'task') + ' at ' + taskLocationName + ' on ' + targetDay.dayName, 'success');
        }

        // Re-render unassigned and recalculate
        renderUnassigned();
        recalculateDays([targetDayIndex]);
        return;
      }

      // Check if same day reorder
      if (draggedLocationData.type === 'assigned' && sourceDayIdx === targetDayIndex) {
        // Reordering within same day
        var sourceLocIndex = draggedLocationData.locIndex;

        // Don't do anything if dropped in same position
        if (sourceLocIndex === dropIndex || sourceLocIndex === dropIndex - 1) {
          console.log('Dropped in same position, no change');
          return;
        }

        // Remove from old position
        var movedLoc = targetDay.assignedLocations.splice(sourceLocIndex, 1)[0];

        // Adjust drop index if removing from before the drop position
        var adjustedDropIndex = dropIndex;
        if (sourceLocIndex < dropIndex) {
          adjustedDropIndex--;
        }

        // Insert at new position
        targetDay.assignedLocations.splice(adjustedDropIndex, 0, movedLoc);

        showStatus('Reordered ' + locationName + ' to position ' + (adjustedDropIndex + 1), 'success');

        // Recalculate this day
        recalculateDays([targetDayIndex]);
        return;
      }

      // Check if target day has locked tasks - ask about time adjustment
      var lockedOnTarget = targetDay.assignedLocations.filter(function(loc) { return loc.isLocked; });
      if (lockedOnTarget.length > 0) {
        var lockedNames = lockedOnTarget.map(function(l) { return l.location; }).join(', ');
        var proceed = confirm(
          'This day has locked manual tasks (' + lockedNames + ').\n\n' +
          'The trip planner will work around these scheduled times.\n\n' +
          'Continue adding to this day?'
        );
        if (!proceed) return;
      }

      // Remove from source
      if (draggedLocationData.type === 'assigned') {
        if (sourceDayIdx >= 0 && sourceDayIdx < tripPlan.workDays.length) {
          tripPlan.workDays[sourceDayIdx].assignedLocations.splice(draggedLocationData.locIndex, 1);
        }
      } else if (draggedLocationData.type === 'office') {
        // Office card - clear office tasks (they're all being moved as one block)
        tripPlan.officeTasks = [];
        console.log('Cleared officeTasks array after dropping Office card');
      } else {
        // From unassigned
        if (draggedLocationData.index >= 0 && draggedLocationData.index < tripPlan.unassignedLocations.length) {
          tripPlan.unassignedLocations.splice(draggedLocationData.index, 1);
        }
      }

      // Add to target at drop position
      var taskCount = 0;
      if (draggedLocationData.location.tasks && draggedLocationData.location.tasks.length) {
        taskCount = draggedLocationData.location.tasks.length;
      } else if (draggedLocationData.location.taskCount) {
        taskCount = draggedLocationData.location.taskCount;
      }

      var locToAdd = {
        location: locationName,
        taskCount: taskCount,
        estimatedTime: draggedLocationData.location.estimatedTime || 25,
        maxUrgency: draggedLocationData.location.maxUrgency || 10,
        tasks: draggedLocationData.location.tasks || [],
        direction: draggedLocationData.location.direction || 'Unknown',
        isManualTask: draggedLocationData.location.isManualTask || false,
        isLocked: false // Items being dragged are not locked
      };

      // Insert at drop position (or end if not specified)
      if (dropIndex >= 0 && dropIndex <= targetDay.assignedLocations.length) {
        targetDay.assignedLocations.splice(dropIndex, 0, locToAdd);
      } else {
        targetDay.assignedLocations.push(locToAdd);
      }

      showStatus('Moved ' + locationName + ' to ' + targetDay.dayName, 'success');

      // Recalculate the affected days
      var indicesToRecalc = [draggedLocationData.dayIndex, targetDayIndex].filter(function(idx) { return idx !== undefined; });
      recalculateDays(indicesToRecalc);
    }

    // Determine where in the list to insert the dropped item
    function getDropIndex(e, dropZone, dayIndex) {
      var locationCards = dropZone.querySelectorAll('.location-card');
      if (locationCards.length === 0) return 0;

      var mouseY = e.clientY;

      for (var i = 0; i < locationCards.length; i++) {
        var card = locationCards[i];
        var rect = card.getBoundingClientRect();
        var cardMiddle = rect.top + rect.height / 2;

        if (mouseY < cardMiddle) {
          return i; // Insert before this card
        }
      }

      return locationCards.length; // Insert at end
    }

    // Recalculate day plans after drag
    function recalculateDays(dayIndices) {
      var uniqueIndices = [];
      dayIndices.forEach(function(idx) {
        if (uniqueIndices.indexOf(idx) === -1 && idx !== undefined && idx >= 0) {
          uniqueIndices.push(idx);
        }
      });

      if (uniqueIndices.length === 0) {
        renderPlan();
        return;
      }

      uniqueIndices.forEach(function(idx) {
        if (idx >= tripPlan.workDays.length) return;

        var day = tripPlan.workDays[idx];

        google.script.run
          .withSuccessHandler(function(plan) {
            if (!plan) {
              console.log('No plan returned for day ' + idx);
              renderPlan();
              return;
            }

            day.plan = plan;

            // Update overnight handling
            if (plan.overnightSuggested && !day.mustReturnToHelena) {
              day.overnightCity = plan.endLocation;
              // Update next day's start location
              if (idx < tripPlan.workDays.length - 1) {
                tripPlan.workDays[idx + 1].startLocation = plan.endLocation;
              }
            } else {
              day.overnightCity = null;
              if (idx < tripPlan.workDays.length - 1) {
                tripPlan.workDays[idx + 1].startLocation = 'Helena';
              }
            }

            renderPlan();
          })
          .withFailureHandler(function(err) {
            console.error('Error recalculating day plan:', err);
            showStatus('Error recalculating: ' + (err.message || err), 'error');
            renderPlan(); // Still render what we have
          })
          .recalculateDayPlan({
            startLocation: day.startLocation,
            assignedLocations: day.assignedLocations,
            arriveFirstBy7am: day.arriveFirstBy7am || false,
            endLocation: day.endLocation || 'Helena',
            // Pass the start location for early drive calculation
            startLocation: day.startLocation || 'Helena'
          });
      });
    }

    // Update overnight city selection
    function updateOvernight(dateKey, city) {
      var dayIdx = -1;
      for (var i = 0; i < tripPlan.workDays.length; i++) {
        if (tripPlan.workDays[i].dateKey === dateKey) {
          dayIdx = i;
          break;
        }
      }
      if (dayIdx === -1) return;

      tripPlan.workDays[dayIdx].overnightCity = city;

      // Update next day's start location
      if (dayIdx < tripPlan.workDays.length - 1) {
        tripPlan.workDays[dayIdx + 1].startLocation = city;
        recalculateDays([dayIdx + 1]);
      }

      renderPlan();
    }

    // Update end location for a day
    function updateEndLocation(dateKey, endCity) {
      var dayIdx = -1;
      for (var i = 0; i < tripPlan.workDays.length; i++) {
        if (tripPlan.workDays[i].dateKey === dateKey) {
          dayIdx = i;
          break;
        }
      }
      if (dayIdx === -1) return;

      var day = tripPlan.workDays[dayIdx];

      // Don't allow non-Helena end on Tuesday
      if (day.mustReturnToHelena && endCity !== 'Helena') {
        showStatus('Tuesday must return to Helena - cannot change end location', 'error');
        renderPlan();
        return;
      }

      day.endLocation = endCity;

      // If switching to Helena, clear overnight
      if (endCity === 'Helena') {
        day.overnightCity = null;

        // Reset next day to start from Helena
        if (dayIdx < tripPlan.workDays.length - 1) {
          tripPlan.workDays[dayIdx + 1].startLocation = 'Helena';
          tripPlan.workDays[dayIdx + 1].arriveFirstBy7am = false;
        }
      }
      // Note: overnight is controlled by the checkbox, not auto-set here

      // Recalculate this day and next day
      var daysToRecalc = [dayIdx];
      if (dayIdx < tripPlan.workDays.length - 1) {
        daysToRecalc.push(dayIdx + 1);
      }
      recalculateDays(daysToRecalc);
    }

    // Helper function to calculate leave time based on drive minutes
    function calculateLeaveTime(driveMinutes) {
      // Start at 7am (420 minutes from midnight), subtract drive time
      var leaveMinutes = 420 - driveMinutes;
      if (leaveMinutes < 0) leaveMinutes += 1440; // Previous day

      var hours = Math.floor(leaveMinutes / 60);
      var mins = leaveMinutes % 60;
      var ampm = hours >= 12 ? 'pm' : 'am';
      if (hours > 12) hours -= 12;
      if (hours === 0) hours = 12;

      return hours + ':' + String(mins).padStart(2, '0') + ampm;
    }

    // Update start location for a day (simple dropdown - just the city to start from)
    function updateStartLocation(dateKey, value) {
      var dayIdx = -1;
      for (var i = 0; i < tripPlan.workDays.length; i++) {
        if (tripPlan.workDays[i].dateKey === dateKey) {
          dayIdx = i;
          break;
        }
      }
      if (dayIdx === -1) return;

      var day = tripPlan.workDays[dayIdx];
      day.startLocation = value;

      // Recalculate this day with new start location
      recalculateDays([dayIdx]);
    }

    // Toggle overnight checkbox
    function toggleOvernight(dateKey, checked) {
      var dayIdx = -1;
      for (var i = 0; i < tripPlan.workDays.length; i++) {
        if (tripPlan.workDays[i].dateKey === dateKey) {
          dayIdx = i;
          break;
        }
      }
      if (dayIdx === -1) return;

      var day = tripPlan.workDays[dayIdx];

        if (dayIdx < tripPlan.workDays.length - 1) {
          tripPlan.workDays[dayIdx + 1].startLocation = endLocation;

        }

        showStatus('Staying overnight in ' + endLocation + '. Next day will start from there.', 'info');
      } else {

        // Reset next day to start from Helena
        if (dayIdx < tripPlan.workDays.length - 1) {
          tripPlan.workDays[dayIdx + 1].startLocation = 'Helena';
        }
      }

      // Recalculate this day and next day
      var daysToRecalc = [dayIdx];
      if (dayIdx < tripPlan.workDays.length - 1) {
        daysToRecalc.push(dayIdx + 1);
      }
      recalculateDays(daysToRecalc);
    }

    function savePlan() {
      showStatus('Saving plan...', 'info');

      google.script.run
        .withSuccessHandler(function(result) {
          showStatus('Plan saved! You can close and return later.', 'success');
        })
        .withFailureHandler(function(err) {
          showStatus('Error saving: ' + err.message, 'error');

    function resetPlan() {
      if (!confirm('Reset plan and generate new suggestions?')) return;

      google.script.run
        .withSuccessHandler(function() {
          generateNewPlan();

    // Apply to schedule
    function applyToSchedule() {
      // Filter days that have assignments
      var daysToApply = tripPlan.workDays.filter(function(day) {
        return day.assignedLocations && day.assignedLocations.length > 0;
      });

      if (daysToApply.length === 0) {
        showStatus('No trip days to apply. Drag locations to days first.', 'error');
        return;
      }

      // Count non-manual tasks that will be updated
      var tasksToUpdate = 0;
      daysToApply.forEach(function(day) {
        day.assignedLocations.forEach(function(loc) {
          if (!loc.isManualTask) {
            tasksToUpdate += loc.taskCount || 1;
          }
        });
      });

      if (!confirm('Update ' + tasksToUpdate + ' task(s) in To-Do List with scheduled dates and times from ' + daysToApply.length + ' trip day(s)?')) return;

      showStatus('Applying schedule...', 'info');

      google.script.run
        .withSuccessHandler(function(result) {
          showStatus(result.message, 'success');
        })
        .withFailureHandler(function(err) {
          showStatus('Error: ' + err.message, 'error');
        })
        .applyTripToSchedule(daysToApply);
    }

    // Helper functions
    function showLoading(show) {
      document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
      document.getElementById('mainContent').style.display = show ? 'none' : 'flex';
    }

    function showStatus(message, type) {
      var bar = document.getElementById('statusBar');
      bar.textContent = message;
      bar.className = 'status-bar ' + type;
      bar.style.display = 'block';

      if (type === 'success' || type === 'info') {
        setTimeout(function() { bar.style.display = 'none'; }, 5000);
      }
    }

    function formatDate(date) {
      if (!date) return '';
      var d = new Date(date);
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return months[d.getMonth()] + ' ' + d.getDate();
    }

    function formatDuration(minutes) {
      if (!minutes) return '0 min';
      if (minutes < 60) return minutes + ' min';
      var hrs = Math.floor(minutes / 60);
      var mins = Math.round(minutes % 60);
      if (mins === 0) return hrs + ' hr' + (hrs > 1 ? 's' : '');
      return hrs + ' hr' + (hrs > 1 ? 's' : '') + ' ' + mins + ' min';
    }

    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

          '<button class="task-popup-close" onclick="closeSplitDialog()">×</button>' +
        '</div>' +
        '<div class="task-popup-content">' +
          '<p style="margin:0 0 12px 0;color:#666;">Select which tasks to move to a different day:</p>' +
          '<div style="max-height:300px;overflow-y:auto;margin-bottom:16px;">' +
            tasksHtml +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:12px;padding:12px;background:#f8f9fa;border-radius:6px;">' +
            '<label style="font-weight:500;">Move selected tasks to:</label>' +

    /**
     * Applies the task split - moves selected tasks to target day.
     */
    function applySplit() {
      var checkboxes = document.querySelectorAll('.split-task-checkbox:checked');
      if (checkboxes.length === 0) {
        alert('Please select at least one task to move');
        return;
      }

      var targetDayIndex = parseInt(document.getElementById('splitTargetDay').value);
      var currentDayIndex = window.currentLocationDayIndex;
      var loc = window.currentPopupLocation;
      var allTasks = window.currentPopupTasks;

      if (targetDayIndex === currentDayIndex) {
        alert('Target day is the same as current day. No changes made.');
        return;
      }

      if (!tripPlan || !tripPlan.workDays) {
        alert('Error: Trip plan not available');
        return;
      }

      if (targetDayIndex < 0 || targetDayIndex >= tripPlan.workDays.length) {
        alert('Error: Invalid target day');
        return;
      }

      // Get selected task indices
      var selectedIndices = [];
      checkboxes.forEach(function(cb) {
        selectedIndices.push(parseInt(cb.dataset.taskIndex));
      });

      // Split tasks into two groups
      var tasksToMove = [];
      var tasksToKeep = [];

      allTasks.forEach(function(task, idx) {
        if (selectedIndices.indexOf(idx) !== -1) {
          tasksToMove.push(task);
        } else {
          tasksToKeep.push(task);
        }
      });

      console.log('Splitting location:', loc.location);
      console.log('Tasks to move:', tasksToMove.length, 'to day', targetDayIndex);
      console.log('Tasks to keep:', tasksToKeep.length, 'on day', currentDayIndex);

      // Update current day - keep remaining tasks
      var currentDay = tripPlan.workDays[currentDayIndex];
      if (currentDay && currentDay.assignedLocations) {
        for (var i = 0; i < currentDay.assignedLocations.length; i++) {
          if (currentDay.assignedLocations[i].location === loc.location) {
            if (tasksToKeep.length > 0) {
              // Update with remaining tasks
              currentDay.assignedLocations[i].tasks = tasksToKeep;
              currentDay.assignedLocations[i].taskCount = tasksToKeep.length;

              // Recalculate estimated time
              var maxUrgency = 0;
              tasksToKeep.forEach(function(t) {
                if (t.urgency > maxUrgency) maxUrgency = t.urgency;
              });
              currentDay.assignedLocations[i].maxUrgency = maxUrgency;
              currentDay.assignedLocations[i].estimatedTime = 15 + (tasksToKeep.length * 10);
            } else {
              // No tasks left - remove location from this day
              currentDay.assignedLocations.splice(i, 1);
            }
            break;
          }
        }
      }

      // Add to target day - create new location entry with moved tasks
      var targetDay = tripPlan.workDays[targetDayIndex];
      if (targetDay) {
        if (!targetDay.assignedLocations) {
          targetDay.assignedLocations = [];
        }

        // Check if location already exists on target day
        var existingLocIndex = -1;
        for (var j = 0; j < targetDay.assignedLocations.length; j++) {
          if (targetDay.assignedLocations[j].location === loc.location) {
            existingLocIndex = j;
            break;
          }
        }

        if (existingLocIndex !== -1) {
          // Merge with existing location
          var existingLoc = targetDay.assignedLocations[existingLocIndex];
          existingLoc.tasks = existingLoc.tasks.concat(tasksToMove);
          existingLoc.taskCount = existingLoc.tasks.length;

          // Recalculate max urgency
          var maxUrg = 0;
          existingLoc.tasks.forEach(function(t) {
            if (t.urgency > maxUrg) maxUrg = t.urgency;
          });
          existingLoc.maxUrgency = maxUrg;
          existingLoc.estimatedTime = 15 + (existingLoc.tasks.length * 10);
        } else {
          // Create new location entry
          var maxUrg2 = 0;
          tasksToMove.forEach(function(t) {
            if (t.urgency > maxUrg2) maxUrg2 = t.urgency;
          });

          var newLocEntry = {
            location: loc.location,
            name: loc.location,
            direction: loc.direction,
            tasks: tasksToMove,
            taskCount: tasksToMove.length,
            maxUrgency: maxUrg2,
            estimatedTime: 15 + (tasksToMove.length * 10),
            isManualTask: false,
            isLocked: false
          };
          targetDay.assignedLocations.push(newLocEntry);
        }
      }

      // Close dialog and re-render
      closeSplitDialog();
      renderPlan();

      showStatus('Split ' + tasksToMove.length + ' task(s) from ' + loc.location + ' to ' + getDayLabel(targetDay.dateKey), 'success');
    }

    /**
     * Gets a readable day label from a dateKey.
     */
    function getDayLabel(dateKey) {
      if (!dateKey) return '';
      var parts = dateKey.split('-');
      if (parts.length !== 3) return dateKey;

      var date = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      return days[date.getDay()] + ' ' + months[date.getMonth()] + ' ' + date.getDate();
    }

    // ============================================================================
    // OFFICE TASKS DIALOG
    // ============================================================================

    /**
     * Shows dialog to enter office tasks for a specific day.
     * Called when Office card is dropped on a day.
     */
    function showOfficeTaskDialog(dayIndex) {
      if (!tripPlan || !tripPlan.workDays || dayIndex < 0 || dayIndex >= tripPlan.workDays.length) {
        console.error('Invalid day index:', dayIndex);
        return;
      }

      var day = tripPlan.workDays[dayIndex];
      var dayLabel = getDayLabel(day.dateKey);

      // Create overlay
      var overlay = document.createElement('div');
      overlay.className = 'task-popup-overlay';
      overlay.id = 'officeTaskOverlay';
      overlay.onclick = function(e) {
        if (e.target === overlay) {
          closeOfficeTaskDialog();
        }
      };

      // Build dialog HTML
      var dialogHtml = '<div class="task-popup" style="max-width: 600px;">' +
        '<div class="task-popup-header">' +
          '<h3>🏢 Office Tasks - ' + dayLabel + '</h3>' +
          '<button class="task-popup-close" onclick="closeOfficeTaskDialog()">×</button>' +
        '</div>' +
        '<div class="task-popup-body" style="max-height: 400px;">' +
          '<p style="color: #666; margin-bottom: 15px;">List the office tasks you completed on this day. These will appear in your Daily Accomplishments report.</p>' +
          '<div id="officeTaskList">' +
            '<div class="office-task-entry" data-task-index="0">' +
              '<input type="text" class="office-task-input" placeholder="e.g., Updated inventory records, Responded to emails" />' +
              '<div style="display: flex; gap: 10px; margin-top: 5px;">' +
                '<input type="time" class="office-time-input" placeholder="Start" style="width: 100px;" />' +
                '<span style="line-height: 30px;">to</span>' +
                '<input type="time" class="office-time-input" placeholder="End" style="width: 100px;" />' +
                '<button class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="removeOfficeTask(0)">Remove</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<button class="btn btn-secondary" style="margin-top: 10px;" onclick="addOfficeTaskRow()">+ Add Another Task</button>' +
        '</div>' +
        '<div class="task-popup-footer">' +
          '<button class="btn btn-secondary" onclick="closeOfficeTaskDialog()">Cancel</button>' +
          '<button class="btn btn-success" onclick="saveOfficeTasks(' + dayIndex + ', \'' + day.dateKey + '\')">Save Office Tasks</button>' +
        '</div>' +
      '</div>';

      overlay.innerHTML = dialogHtml;
      document.body.appendChild(overlay);

      // Store day info globally
      window.currentOfficeDayIndex = dayIndex;
      window.currentOfficeDateKey = day.dateKey;
    }

    function closeOfficeTaskDialog() {
      var overlay = document.getElementById('officeTaskOverlay');
      if (overlay) {
        overlay.remove();
      }
    }

    var officeTaskCounter = 1;

    function addOfficeTaskRow() {
      var container = document.getElementById('officeTaskList');
      if (!container) return;

      var taskIndex = officeTaskCounter++;
      var newRow = document.createElement('div');
      newRow.className = 'office-task-entry';
      newRow.dataset.taskIndex = taskIndex;
      newRow.style.marginTop = '15px';
      newRow.innerHTML = '<input type="text" class="office-task-input" placeholder="e.g., Processed purchase orders" />' +
        '<div style="display: flex; gap: 10px; margin-top: 5px;">' +
          '<input type="time" class="office-time-input" placeholder="Start" style="width: 100px;" />' +
          '<span style="line-height: 30px;">to</span>' +
          '<input type="time" class="office-time-input" placeholder="End" style="width: 100px;" />' +
          '<button class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="removeOfficeTask(' + taskIndex + ')">Remove</button>' +
        '</div>';

      container.appendChild(newRow);
    }

    function removeOfficeTask(taskIndex) {
      var entry = document.querySelector('.office-task-entry[data-task-index="' + taskIndex + '"]');
      if (entry) {
        entry.remove();
      }
    }

    function saveOfficeTasks(dayIndex, dateKey) {
      var entries = document.querySelectorAll('.office-task-entry');
      var officeTasks = [];

      entries.forEach(function(entry) {
        var description = entry.querySelector('.office-task-input').value.trim();
        if (!description) return; // Skip empty entries

        var timeInputs = entry.querySelectorAll('.office-time-input');
        var startTime = timeInputs[0] ? timeInputs[0].value : '';
        var endTime = timeInputs[1] ? timeInputs[1].value : '';

        officeTasks.push({
          description: description,
          startTime: startTime,
          endTime: endTime
        });
      });

      if (officeTasks.length === 0) {
        showStatus('Please enter at least one office task', 'error');
        return;
      }

      showStatus('Saving office tasks...', 'info');

      // Call backend to save
      google.script.run
        .withSuccessHandler(function(result) {
          closeOfficeTaskDialog();
          // Refresh unassigned and calendar/task list after saving
          if (typeof renderUnassigned === 'function') renderUnassigned();
          if (typeof renderCalendar === 'function') renderCalendar();
          if (typeof renderPlan === 'function') renderPlan();
          showStatus('Office tasks saved!', 'success');
        })
        .withFailureHandler(function(error) {
          showStatus('Error saving tasks: ' + error.message, 'error');
        })
        .saveOfficeTasks(dateKey, officeTasks);
    }

    // Close the Trip Planner dialog
    function backToHub() {
      google.script.host.close();
    }
  </script>
</body>
